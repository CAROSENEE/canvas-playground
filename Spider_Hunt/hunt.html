<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Spider Hunt – The Weaver's Ground</title>
<style>
*{box-sizing:border-box;margin:0;user-select:none}
html,body{height:100%;overflow:hidden;background:#030806;font-family:'Rajdhani','Segoe UI',sans-serif;color:#dff}
canvas{position:fixed;inset:0;cursor:crosshair}
.abs{position:fixed}
#tl{top:14px;left:16px;color:#9bff3a;font-weight:700}
#tl b{font-size:22px;letter-spacing:1px}#tl small{display:block;font-size:11px;color:#8fb;opacity:.7}
#prog{width:110px;height:3px;background:#1a3a2a;margin:4px 0}#prog i{display:block;height:100%;width:0;background:#9bff3a}
#tc{top:10px;left:50%;transform:translateX(-50%);text-align:center}
#score{font-size:30px;font-weight:700;color:#eef}#best{font-size:11px;color:#ff9a1f;font-weight:700}
#combo{font-size:11px;color:#ff3d9a;font-weight:700;letter-spacing:1px;height:14px}
#tr{top:14px;right:16px;display:flex;gap:6px}
.sb{min-width:34px;height:34px;border:1px solid #2a7a6a;background:#0a2a24;color:#3df0e0;border-radius:7px;font:700 13px inherit;cursor:pointer;padding:0 8px}
.sb:hover{background:#12453b}#vol{border-color:#ff9a1f;color:#ff9a1f}
#bl{bottom:34px;left:16px;width:150px}
.bar{height:11px;border-radius:6px;background:#07130f;border:1px solid #1d4a3c;margin-top:5px;overflow:hidden;font-size:8px;position:relative}
.bar i{display:block;height:100%;width:100%}
#silk i{background:linear-gradient(90deg,#3df0e0,#fff)}#hun i{background:linear-gradient(90deg,#ff9a1f,#9bff3a)}
.bar span{position:absolute;left:5px;top:0;line-height:10px;font-weight:700;color:#023}
#zoom{bottom:34px;left:50%;transform:translateX(-50%);display:flex;gap:8px;align-items:center;padding:8px 10px;border:1px solid #1d4a3c;border-radius:8px;background:#06120ecc}
#zoom span{min-width:50px;text-align:center;font-weight:700}
#br{bottom:26px;right:16px;display:flex;gap:10px;align-items:flex-end}
.rb{--p:0deg;width:60px;height:60px;border-radius:50%;border:3px solid;font:700 11px inherit;cursor:pointer;color:inherit;
 background:conic-gradient(rgba(0,0,0,.7) var(--p),rgba(0,10,8,.55) 0);display:flex;flex-direction:column;align-items:center;justify-content:center}
.rb small{font-size:8px;opacity:.6}
#bSnare{border-color:#9bff3a;color:#9bff3a}#bDash{border-color:#3df0e0;color:#3df0e0;width:68px;height:68px}
#bReel{border-color:#ff3d9a;color:#ff3d9a;display:none;box-shadow:0 0 14px #ff3d9a88}
#hint{bottom:8px;width:100%;text-align:center;font-size:9px;letter-spacing:1px;opacity:.4}
#banner{top:30%;width:100%;text-align:center;pointer-events:none;opacity:0;transition:opacity .5s}
#banner.show{opacity:1}
#bnTop{font-size:11px;letter-spacing:2px;color:#8fb;opacity:.7}
#bnClr{display:none;border:1px solid #9bff3a;color:#9bff3a;font-weight:700;font-size:12px;padding:3px 10px;border-radius:12px;margin:4px;background:#0a2a14}
#bnName{font:400 46px Georgia,serif;color:#e8ffc8;text-shadow:0 0 18px #9bff3a66}
#bnSub{font-size:12px;color:#8fb;opacity:.7}
#ov{inset:0;background:#000b;display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px;text-align:center}
#ov.show{display:flex}#ovT{font:400 44px Georgia,serif;color:#e8ffc8}
#ovB{padding:10px 26px;font:700 16px inherit;background:#0a2a24;border:2px solid #3df0e0;color:#3df0e0;border-radius:24px;cursor:pointer}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="tl" class="abs"><b id="hNo">HUNT 1</b><small id="hName"></small><div id="prog"><i></i></div><small id="hCaught"></small></div>
<div id="tc" class="abs"><div id="score">0</div><div id="best">BEST 0</div><div id="combo"></div></div>
<div id="tr" class="abs">
  <button class="sb" id="vol">MAX</button><button class="sb" id="pause">❚❚</button><button class="sb" id="rst">↻</button>
</div>
<div id="banner" class="abs"><div id="bnTop"></div><div id="bnClr"></div><div id="bnName"></div><div id="bnSub"></div></div>
<div id="bl" class="abs">
  <div class="bar" id="silk"><i></i><span>SILK</span></div>
  <div class="bar" id="hun"><i></i><span>HUNGER</span></div>
</div>
<div id="zoom" class="abs"><button class="sb" id="zo">−</button><span id="zt">100%</span><button class="sb" id="zi">+</button><button class="sb" id="zc">CENTRE</button></div>
<div id="br" class="abs">
  <button class="rb" id="bReel">REEL<small>R</small></button>
  <button class="rb" id="bSnare">SNARE<small>Q</small></button>
  <button class="rb" id="bDash">DASH<small>SPACE</small></button>
</div>
<div id="hint" class="abs">MOUSE MOVES SPIDER · Q SNARE · SPACE DASH · R REEL · CTRL+SCROLL ZOOM · MIDDLE-DRAG PAN · P PAUSE</div>
<div id="ov" class="abs"><div id="ovT"></div><div id="ovS"></div><button id="ovB">PLAY AGAIN</button></div>

<script>
'use strict';
const $=i=>document.getElementById(i),cv=$('c'),ctx=cv.getContext('2d');
const WW=1600,HH=1000,R=Math.random,PI2=Math.PI*2,clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
let W,H,base;
function resize(){W=cv.width=innerWidth;H=cv.height=innerHeight;base=Math.max(W/WW,H/HH)}
addEventListener('resize',resize);resize();

const NAMES=['First Thread','Dew Hours','Moth Season','Silent Hollow','Hunger Moon','Last Weaving','Night Choir','Final Silk'];
const cam={x:WW/2,y:HH/2,z:1}, mouse={sx:W/2,sy:H/2,x:WW/2,y:HH/2};
let best=+localStorage.getItem('sh_best')||0, vol=1, paused=false, S, sp, ovAct=()=>{};
const leaves=[...Array(70)].map(()=>({x:R()*WW,y:R()*HH,a:R()*PI2,s:8+R()*14}));
const flies=[...Array(16)].map(()=>({x:R()*WW,y:R()*HH,a:R()*PI2,p:R()*9}));

/* ---------- audio ---------- */
let AC;
function tone(f,d=.1,type='sine',v=.12){
  if(!vol)return;
  try{AC=AC||new AudioContext();const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime;
    o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v*vol,t);g.gain.exponentialRampToValueAtTime(.001,t+d);
    o.connect(g);g.connect(AC.destination);o.start();o.stop(t+d);}catch(e){}
}

/* ---------- game state ---------- */
const target=()=>2+2*S.hunt;
function reset(){
  S={state:'play',hunt:1,caught:0,score:0,combo:0,comboT:0,silk:100,hunger:100,prey:[],webs:[],fx:[],
     cdS:0,cdD:0,cdR:0,dash:0,bannerT:0,trail:[]};
  sp={x:WW/2,y:HH/2,a:-1.57,ph:0};
  for(let i=0;i<7;i++)spawn();
  banner('');
  $('ov').classList.remove('show');paused=false;
}
function banner(cleared){
  $('bnTop').textContent=`HUNT ${S.hunt} / 8`;
  $('bnClr').textContent=cleared;$('bnClr').style.display=cleared?'inline-block':'none';
  $('bnName').textContent=NAMES[S.hunt-1];
  $('bnSub').textContent=`Catch ${target()} before hunger empties`;
  $('banner').classList.add('show');S.bannerT=2.8;
}
function spawn(){
  const k=R()<.4?'moth':'beetle',s=R()*4|0;
  const x=s<2?R()*WW:(s==2?-20:WW+20), y=s<2?(s?HH+20:-20):R()*HH;
  S.prey.push({k,x,y,a:Math.atan2(HH/2-y,WW/2-x)+(R()-.5),v:k=='moth'?55:38,r:k=='moth'?12:9,
    web:null,str:0,imm:0,ph:R()*9,reel:false});
}
function eat(p){
  const s=S,pts=p.k=='moth'?20:10;
  s.combo++;s.comboT=5;
  const g=pts*s.combo;s.score+=g;
  s.hunger=Math.min(100,s.hunger+(p.k=='moth'?14:9));s.caught++;
  s.fx.push({x:p.x,y:p.y,t:1,txt:'+'+g,c:p.k=='moth'?'#ff6ab8':'#ffb040'});
  tone(520+s.combo*60,.15,'square',.07);
  if(s.score>best){best=s.score;localStorage.setItem('sh_best',best)}
  if(s.caught>=target()){
    if(s.hunt>=8)end(true);
    else{s.hunt++;s.caught=0;s.silk=100;banner(`HUNT ${s.hunt-1} CLEARED`);tone(880,.4,'triangle')}
  }
}
function end(win){
  S.state='over';
  $('ovT').textContent=win?'THE WEB IS COMPLETE':'STARVED';
  $('ovS').textContent=`Score ${S.score} · Best ${best} · Hunt ${S.hunt}`;
  $('ovB').textContent='PLAY AGAIN';ovAct=reset;
  $('ov').classList.add('show');tone(win?900:110,.6,'triangle');
}

/* ---------- actions ---------- */
function snare(){
  const s=S;if(s.state!=='play'||paused)return;
  if(s.silk<30||s.cdS>0)return tone(120,.1,'sawtooth');
  s.silk-=30;s.cdS=.8;s.webs.push({x:sp.x,y:sp.y,r:75,life:26,rot:R()});tone(660,.2);
}
function dash(){if(S.state!=='play'||paused||S.cdD>0)return;S.cdD=3;S.dash=.22;tone(200,.2,'sawtooth',.07)}
function reel(){
  const s=S;if(s.state!=='play'||paused||s.combo<3||s.cdR>0)return;
  let b=null,bd=1e9;
  for(const p of s.prey){const d=Math.hypot(p.x-sp.x,p.y-sp.y);if(d<bd){bd=d;b=p}}
  if(b){b.reel=true;s.cdR=6;tone(300,.3,'square')}
}
function togglePause(){
  if(S.state!=='play')return;
  paused=!paused;
  if(paused){$('ovT').textContent='PAUSED';$('ovS').textContent='';$('ovB').textContent='RESUME';ovAct=togglePause;$('ov').classList.add('show')}
  else $('ov').classList.remove('show');
}

/* ---------- update ---------- */
function update(dt){
  const s=S;if(s.state!=='play')return;
  s.hunger-=dt*(1.3+s.hunt*.15);
  s.silk=Math.min(100,s.silk+dt*5);
  s.cdS=Math.max(0,s.cdS-dt);s.cdD=Math.max(0,s.cdD-dt);s.cdR=Math.max(0,s.cdR-dt);
  if(s.comboT>0&&(s.comboT-=dt)<=0)s.combo=0;
  if(s.bannerT>0&&(s.bannerT-=dt)<=0)$('banner').classList.remove('show');

  // spider
  const dx=mouse.x-sp.x,dy=mouse.y-sp.y,d=Math.hypot(dx,dy);let sv=0;
  if(s.dash>0){s.dash-=dt;sv=560}else if(d>10)sv=Math.min(d*4,190);
  if(d>1){let da=Math.atan2(dy,dx)-sp.a;da=Math.atan2(Math.sin(da),Math.cos(da));sp.a+=da*Math.min(1,dt*(s.dash>0?30:10))}
  sp.x=clamp(sp.x+Math.cos(sp.a)*sv*dt,10,WW-10);
  sp.y=clamp(sp.y+Math.sin(sp.a)*sv*dt,10,HH-10);
  sp.ph+=sv*dt*.05;
  s.trail.push([sp.x,sp.y]);if(s.trail.length>260)s.trail.shift();

  // webs
  for(const w of s.webs)w.life-=dt;
  s.webs=s.webs.filter(w=>w.life>0);

  // prey
  for(const p of s.prey){
    p.ph+=dt*12;p.imm-=dt;
    if(p.reel){
      const a=Math.atan2(sp.y-p.y,sp.x-p.x);p.x+=Math.cos(a)*420*dt;p.y+=Math.sin(a)*420*dt;p.web=null;
    }else if(p.web){
      p.x+=(R()-.5)*1.2;p.y+=(R()-.5)*1.2;p.str-=dt;
      if(p.str<=0){p.web.life-=6;p.web=null;p.imm=2.5}
    }else{
      p.a+=(R()-.5)*3*dt;p.x+=Math.cos(p.a)*p.v*dt;p.y+=Math.sin(p.a)*p.v*dt;
      if(p.x<-40||p.x>WW+40||p.y<-40||p.y>HH+40)p.a=Math.atan2(HH/2-p.y,WW/2-p.x);
      if(p.imm<=0)for(const w of s.webs)if(Math.hypot(p.x-w.x,p.y-w.y)<w.r*.85){p.web=w;p.str=6+R()*4;tone(300,.12,'triangle');break}
    }
    if((p.web||p.reel)&&Math.hypot(p.x-sp.x,p.y-sp.y)<20){p.dead=true;eat(p)}
  }
  s.prey=s.prey.filter(p=>!p.dead);
  while(s.prey.length<6+s.hunt)spawn();
  for(const f of s.fx)f.t-=dt;
  s.fx=s.fx.filter(f=>f.t>0);
  if(s.hunger<=0){s.hunger=0;end(false)}
}

/* ---------- drawing ---------- */
function drawWeb(w){
  const al=Math.min(1,w.life/4)*.85,n=14,rings=8;
  ctx.save();ctx.translate(w.x,w.y);ctx.rotate(w.rot);
  ctx.strokeStyle=`rgba(210,255,235,${al})`;ctx.lineWidth=1;ctx.beginPath();
  for(let i=0;i<n;i++){const a=i/n*PI2;ctx.moveTo(0,0);ctx.lineTo(Math.cos(a)*w.r,Math.sin(a)*w.r)}
  for(let k=1;k<=rings;k++){
    const r=w.r*k/rings;ctx.moveTo(r,0);
    for(let i=1;i<=n;i++){const a=i/n*PI2,m=(i-.5)/n*PI2;
      ctx.quadraticCurveTo(Math.cos(m)*r*.93,Math.sin(m)*r*.93,Math.cos(a)*r,Math.sin(a)*r)}
  }
  ctx.stroke();ctx.restore();
}
function drawPrey(p){
  ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.a+1.57);
  const f=Math.sin(p.ph)*.5+.5;
  if(p.k=='moth'){
    ctx.fillStyle='#ff6fb9';ctx.shadowColor='#ff3d9a';ctx.shadowBlur=10;
    for(const sd of[-1,1]){ctx.beginPath();ctx.ellipse(sd*(5+f*3),0,6+f*3,11,sd*.3,0,PI2);ctx.fill()}
    ctx.fillStyle='#7a2a55';ctx.fillRect(-1.5,-7,3,14);
  }else{
    ctx.fillStyle='#e8a050';ctx.shadowColor='#ffb040';ctx.shadowBlur=6;
    ctx.beginPath();ctx.ellipse(0,0,6,9,0,0,PI2);ctx.fill();
    ctx.fillStyle='#5a2a10';ctx.fillRect(-.6,-8,1.2,16);
  }
  ctx.restore();
  if(p.web){
    ctx.strokeStyle='rgba(255,255,255,.8)';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(p.x,p.y,p.r+4,0,PI2);ctx.stroke();
    ctx.fillStyle='#fff';ctx.fillRect(p.x-12,p.y-p.r-12,24*Math.max(0,p.str/8),3);
  }
}
function drawSpider(){
  ctx.save();ctx.translate(sp.x,sp.y);
  ctx.strokeStyle='rgba(150,255,80,.7)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,0,24,0,PI2);ctx.stroke();
  ctx.rotate(sp.a);ctx.strokeStyle='#8fe040';ctx.lineWidth=1.6;
  for(let i=0;i<4;i++)for(const sd of[-1,1]){
    const a=(.7+i*.45)*sd+Math.sin(sp.ph*2+i*1.7*sd)*.3;
    const kx=Math.cos(a)*14,ky=Math.sin(a)*14;
    ctx.beginPath();ctx.moveTo(2-i*3,0);ctx.lineTo(kx,ky);
    ctx.lineTo(kx+Math.cos(a+sd*.7)*10,ky+Math.sin(a+sd*.7)*10);ctx.stroke();
  }
  ctx.fillStyle='#5fbf30';ctx.shadowColor='#9bff3a';ctx.shadowBlur=12;
  ctx.beginPath();ctx.ellipse(-6,0,9,6.5,0,0,PI2);ctx.fill();
  ctx.beginPath();ctx.ellipse(5,0,5.5,4.5,0,0,PI2);ctx.fill();
  ctx.restore();
}
function draw(t,dt){
  ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#030806';ctx.fillRect(0,0,W,H);
  const z=cam.z*base;
  ctx.setTransform(z,0,0,z,W/2-cam.x*z,H/2-cam.y*z);
  // background
  const g=ctx.createRadialGradient(WW/2,HH/2,100,WW/2,HH/2,1100);
  g.addColorStop(0,'#0b2a22');g.addColorStop(1,'#020605');ctx.fillStyle=g;ctx.fillRect(0,0,WW,HH);
  ctx.fillStyle='rgba(120,220,190,.07)';ctx.beginPath();
  ctx.moveTo(300,0);ctx.lineTo(900,0);ctx.lineTo(1250,HH);ctx.lineTo(250,HH);ctx.closePath();ctx.fill();
  for(const l of leaves){
    ctx.save();ctx.translate(l.x,l.y);ctx.rotate(l.a);ctx.fillStyle='rgba(30,90,50,.35)';
    ctx.beginPath();ctx.ellipse(0,0,l.s,l.s*.4,0,0,PI2);ctx.fill();ctx.restore();
  }
  for(const f of flies){
    f.a+=(R()-.5)*dt*4;f.x=(f.x+Math.cos(f.a)*14*dt+WW)%WW;f.y=(f.y+Math.sin(f.a)*14*dt+HH)%HH;
    ctx.fillStyle=`rgba(160,255,60,${.4+.4*Math.sin(t*2+f.p)})`;ctx.shadowColor='#9bff3a';ctx.shadowBlur=10;
    ctx.beginPath();ctx.arc(f.x,f.y,3,0,PI2);ctx.fill();
  }
  ctx.shadowBlur=0;
  // trail
  if(S.trail.length>1){
    ctx.strokeStyle='rgba(180,230,210,.13)';ctx.lineWidth=1;ctx.beginPath();
    ctx.moveTo(S.trail[0][0],S.trail[0][1]);for(const p of S.trail)ctx.lineTo(p[0],p[1]);ctx.stroke();
  }
  for(const w of S.webs)drawWeb(w);
  for(const p of S.prey)drawPrey(p);
  drawSpider();
  ctx.font='bold 18px sans-serif';ctx.textAlign='center';
  for(const f of S.fx){ctx.globalAlpha=f.t;ctx.fillStyle=f.c;ctx.fillText(f.txt,f.x,f.y-(1-f.t)*30)}
  ctx.globalAlpha=1;
}

/* ---------- HUD ---------- */
function hud(){
  const s=S;
  $('hNo').textContent='HUNT '+s.hunt;$('hName').textContent=NAMES[s.hunt-1].toUpperCase();
  $('prog').firstChild.style.width=s.caught/target()*100+'%';
  $('hCaught').textContent=`CAUGHT ${s.caught} / ${target()}`;
  $('score').textContent=s.score;$('best').textContent='BEST '+best;
  $('combo').textContent=s.combo>=3?`COMBO x${s.combo} — REEL READY`:s.combo>=2?`COMBO x${s.combo}`:'';
  $('silk').firstChild.style.width=s.silk+'%';$('hun').firstChild.style.width=s.hunger+'%';
  $('bSnare').style.setProperty('--p',(s.silk<30?360:s.cdS/.8*360)+'deg');
  $('bDash').style.setProperty('--p',s.cdD/3*360+'deg');
  $('bReel').style.display=s.combo>=3?'flex':'none';
  $('bReel').style.setProperty('--p',s.cdR/6*360+'deg');
  $('zt').textContent=Math.round(cam.z*100)+'%';
}

/* ---------- input ---------- */
function setMouse(x,y){mouse.sx=x;mouse.sy=y}
function toWorld(){const z=cam.z*base;mouse.x=(mouse.sx-W/2)/z+cam.x;mouse.y=(mouse.sy-H/2)/z+cam.y}
let panning=false;
cv.addEventListener('pointermove',e=>{
  if(panning){const z=cam.z*base;cam.x-=e.movementX/z;cam.y-=e.movementY/z}
  setMouse(e.clientX,e.clientY);
});
cv.addEventListener('pointerdown',e=>{if(e.button==1){panning=true;e.preventDefault()}setMouse(e.clientX,e.clientY)});
addEventListener('pointerup',()=>panning=false);
cv.addEventListener('wheel',e=>{if(e.ctrlKey){e.preventDefault();zoom(e.deltaY<0?1.1:.9)}},{passive:false});
function zoom(f){cam.z=clamp(cam.z*f,.6,2.5)}
addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();
  if(k==' '){e.preventDefault();dash()}else if(k=='q')snare();else if(k=='r')reel();else if(k=='p')togglePause();
});
$('bSnare').onclick=snare;$('bDash').onclick=dash;$('bReel').onclick=reel;
$('pause').onclick=togglePause;$('rst').onclick=reset;
$('zi').onclick=()=>zoom(1.15);$('zo').onclick=()=>zoom(1/1.15);
$('zc').onclick=()=>{cam.z=1;cam.x=WW/2;cam.y=HH/2};
$('vol').onclick=()=>{vol=vol==1?.5:vol==.5?0:1;$('vol').textContent=vol==1?'MAX':vol==.5?'MID':'OFF'};
$('ovB').onclick=()=>ovAct();

/* ---------- loop ---------- */
reset();
let last=performance.now();
function loop(n){
  const dt=Math.min(.05,(n-last)/1000);last=n;
  toWorld();if(!paused)update(dt);
  draw(n/1000,paused?0:dt);hud();requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
