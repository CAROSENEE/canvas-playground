<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Heart Of Love</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1 class="title">Heart Of Love</h1>

  <main class="page">
    <div class="stage" id="stage">

      <!-- Cute character -->
      <svg class="char" viewBox="0 0 150 200" aria-hidden="true">
        <g fill="#fff" stroke="#111" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="70" cy="58" r="40"/>
          <path d="M45 98c-6 30-8 60-4 80h58c4-20 2-50-6-80"/>
          <path d="M100 118c18-4 28-16 40-26" fill="none"/>
        </g>
        <g fill="#111">
          <circle cx="55" cy="55" r="3.5"/>
          <circle cx="86" cy="55" r="3.5"/>
        </g>
        <path d="M62 68q8 8 17 0" fill="none" stroke="#111" stroke-width="3" stroke-linecap="round"/>
        <g fill="#f7a8b5" opacity=".7">
          <ellipse cx="45" cy="68" rx="7" ry="5"/>
          <ellipse cx="96" cy="68" rx="7" ry="5"/>
        </g>
        <circle id="hand" cx="141" cy="90" r="4" fill="#fff" stroke="#111" stroke-width="3"/>
      </svg>

      <div class="heart-grid" id="grid"></div>
      <p class="love-text" id="text">I Love You</p>
    </div>

    <pre class="note">Click the card to replay</pre>
  </main>

  <script src="script.js"></script>
</body>
</html>
